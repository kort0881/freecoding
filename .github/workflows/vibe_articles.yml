name: Vibe Articles (3x daily)
on:
  schedule:
    # 09:15 UTC = 12:15 МСК
    # 15:15 UTC = 18:15 МСК
    # 21:15 UTC = 00:15 МСК (след. дня)
    - cron: '15 9,15,21 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache state
        uses: actions/cache@v3
        with:
          path: cache_vibe
          key: vibe-articles-${{ github.run_id }}
          restore-keys: |
            vibe-articles-
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run article scout
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          POST_MODE: articles
        run: python scripts/vibe_scout.py
